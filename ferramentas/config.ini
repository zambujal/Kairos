; config.ini do cartao.py (fica ao lado dele). O que vem na linha de comando ganha.
;
; Correr:   python3 cartao.py /run/media/$USER/CARTAO           (so' mostra)
;           python3 cartao.py /run/media/$USER/CARTAO --fazer   (faz)

[pastas]
; barra de baixo do navegador, por esta ordem (ate' 8)
; NOME              procura no cartao a pasta com esse nome (a menos funda)
; ROTULO = CAMINHO  o rotulo (ate' 6 letras) e' o que aparece: [FAVORI]
FAVORI = FAVORITOS

[opcoes]
; yes = nomes de 17 letras (so' para o navegador de 32 colunas)
normal = no
