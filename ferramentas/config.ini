; config.ini do cartao.py (fica ao lado dele). O que vem na linha de comando ganha.
;
; Correr, na raiz do cartao:   python3 cartao.py .            (so' mostra)
;                              python3 cartao.py . --fazer    (faz os indices)

[pastas]
; atalhos na barra das pastas do navegador (linha 2 do ecra; tecla 9), ate' 8, por esta ordem
; ROTULO = PASTA    o rotulo (ate' 6 letras) e' o que aparece: [FAVORI]
;                   a pasta: so' o nome (a menos funda com esse nome) ou o caminho (MUSICA/PT3)
; PASTA             so' o nome: o rotulo e' o proprio nome
FAVORI = FAVORITOS

[opcoes]
; yes = nomes de 17 letras (so' para o navegador normal de 32 colunas); no NAVHR fica no
normal = no
