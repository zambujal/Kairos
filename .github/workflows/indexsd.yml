# Faz o indexSD (janela dos indices do cartao) em executavel: indexSD.exe (Windows) e indexSD (Linux).
# Corre quando muda alguma coisa em ferramentas/ ou a pedido (Actions -> indexSD -> Run workflow).
# Os executaveis ficam em "Artifacts" no fim de cada execucao.
name: indexSD
on:
  workflow_dispatch:
  push:
    paths:
      - 'ferramentas/cartao.py'
      - 'ferramentas/indexSD_gui.pyw'
      - '.github/workflows/indexsd.yml'
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller
      - name: executavel
        shell: bash
        run: |
          cd ferramentas
          cp indexSD_gui.pyw indexSD_gui.py
          python -m PyInstaller --onefile --windowed --name indexSD --paths . --hidden-import cartao indexSD_gui.py
          cp config.ini dist/
      - uses: actions/upload-artifact@v4
        with:
          name: indexSD-${{ runner.os }}
          path: ferramentas/dist/
